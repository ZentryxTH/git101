name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  
jobs:
  build:
    runs-on: ubuntu-latest 
    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build --file Dockerfile -t kantsuw/myapp:latest .
  list-images:
    runs-on: ubuntu-latest 
    steps:
    - name: List images
      run: docker images
  push:
    runs-on: ubuntu-latest 
    steps:
    - name: login 
      run: docker login -u kantsuw -p dckr_pat_xvedQKPtLqLWlLU_u7y4Wlkko5A
    - name: push docker 
      run: docker push kantsuw/myapp:latest

